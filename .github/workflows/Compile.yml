name: Build Java JAR

# Trigger the workflow on pushes or pull requests to the main branch
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Clone your repository onto the GitHub runner
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up the Java environment (JDK 17 in this example)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin' # Popular OpenJDK vendor
        cache: 'maven'          # Caches dependencies to speed up future runs

    # 3. Compile code and package it into a JAR file
    - name: Build with Maven
      run: mvn clean package -DskipTests

    # 4. Save and expose the JAR file as a downloadable artifact
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: java-app-jar
        path: target/*.jar
        
