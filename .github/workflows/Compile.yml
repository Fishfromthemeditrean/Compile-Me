name: Build Java JAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Clone your repository onto the GitHub runner
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up the Java environment (JDK 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Compile Java files and package them into a JAR
    - name: Compile and Package JAR
      run: |
        mkdir -p bin
        # Compiles all Java files in your repository into the 'bin' folder
        find . -name "*.java" | xargs javac -d bin
        
        # Creates the JAR file. Note: Replace 'Main' with your actual main class name if needed
        jar cfe app.jar Main -C bin .

    # 4. Save and expose the JAR file as a downloadable artifact
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: java-app-jar
        path: app.jar
