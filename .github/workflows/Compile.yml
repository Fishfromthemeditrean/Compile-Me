name: Build Java JAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Clone your repository onto the GitHub runner
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
      packages: 'platform-tools build-tools-34-0-0 platforms-android-34'

    # 2. Set up the Java environment (JDK 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Set up Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 4. Compile Java files with Android classpath and package them into a JAR
    - name: Compile and Package JAR
      run: |
        mkdir -p bin
        
        # Find the path to the android.jar platform library (using API 34 as an example)
        # You can change 'android-34' to your target API level
        ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
        
        # Compiles all Java files including the Android classpath
        find . -name "*.java" | xargs javac -cp "$ANDROID_JAR" -d bin
        
        # Creates the JAR file. Note: Replace 'Main' with your actual main class name if needed
        jar cfe app.jar Main -C bin .

    # 5. Save and expose the JAR file as a downloadable artifact
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: java-app-jar
        path: app.jar
