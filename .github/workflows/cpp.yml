name: Manual Build Android .so
#built by an AI not me.
on:
  workflow_dispatch

jobs:
  build-so:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your project's C++ source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java (Required by Android SDK)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Install Android SDK Tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      # 4. Install NDK & CMake via SDKManager
      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      # 5. Set NDK Environment Variable explicitly
      - name: Set NDK Path
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV

      # 6. Build the entire project in RELEASE mode
      - name: Build Release Variant
        run: |
          mkdir -p build_release
          cd build_release
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.ANDROID_NDK_HOME }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      # 7. Build the entire project in DEBUG mode
      - name: Build Debug Variant
        run: |
          mkdir -p build_debug
          cd build_debug
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.ANDROID_NDK_HOME }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Debug
          make -j$(nproc)

      # 8. Collect and upload both Debug and Release .so libraries
      - name: Upload .so Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-so-libraries
          path: |
            build_release/**/*.so
            build_debug/**/*.so
