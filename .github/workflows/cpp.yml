name: Manual Build Android .so
#this is by an ai i didnt do anything
# 1. This enables the manual "Run workflow" button in the GitHub UI
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (Release/Debug)'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-so:
    runs-on: ubuntu-latest

    steps:
      # 2. Checkout your project's C++ source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 3. Setup Java (Required by the Android SDK components)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Install Android NDK & CMake
      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'
        # This automatically sets up $ANDROID_NDK_HOME

      - name: Install NDK Component via SDKManager
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      # 5. Build compiling your C++ code to .so
      # OPTION A: Using CMake (Recommended for modern Android C++)
      - name: Build with CMake & NDK
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type }}
          make

      # OPTION B: Alternatively, if you use standard ndk-build (Android.mk / Application.mk)
      # Uncomment the lines below and comment out Option A if needed:
      # - name: Build with ndk-build
      #   run: |
          # $ANDROID_NDK_HOME/ndk-build APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk

      # 6. Collect and upload the .so libraries as a zip artifact
      - name: Upload .so Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-so-libraries-${{ github.event.inputs.build_type }}
          # Path looks for any .so files inside your workspace recursively
          path: |
            **/*.so
           

      # 5. Build compiling your C++ code to .so
      # OPTION A: Using CMake (Recommended for modern Android C++)
      - name: Build with CMake & NDK
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Debug
          make

      # OPTION B: Alternatively, if you use standard ndk-build (Android.mk / Application.mk)
      # Uncomment the lines below and comment out Option A if needed:
      # - name: Build with ndk-build
      #   run: |
          # $ANDROID_NDK_HOME/ndk-build APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk

      # 6. Collect and upload the .so libraries as a zip artifact
      - name: Upload .so Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-so-libraries-${{ github.event.inputs.build_type }}
          # Path looks for any .so files inside your workspace recursively
          path: |
            **/*.so
            
